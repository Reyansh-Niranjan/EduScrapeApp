<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap');
      .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .mono { font-family: 'Geist Mono', 'SF Mono', monospace; }
      .serif { font-family: 'Newsreader', 'Playfair Display', Georgia, serif; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="675" fill="#141416"/>
  
  <!-- Outer Window Frame -->
  <g transform="translate(30, 24)">
    <rect width="1140" height="627" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    
    <!-- Window Header -->
    <path d="M 0 8 Q 0 0 8 0 L 1132 0 Q 1140 0 1140 8 L 1140 40 L 0 40 Z" fill="#202024"/>
    <line x1="0" y1="40" x2="1140" y2="40" stroke="#27272A" stroke-width="1"/>
    
    <!-- Window Dots -->
    <circle cx="20" cy="20" r="4.5" fill="#52525B" opacity="0.6"/>
    <circle cx="34" cy="20" r="4.5" fill="#52525B" opacity="0.6"/>
    <circle cx="48" cy="20" r="4.5" fill="#52525B" opacity="0.6"/>
    
    <!-- Brand Title in Header -->
    <text x="80" y="24" fill="#A1A1AA" font-size="11" class="mono" font-weight="600">NOVASLATE // WORKSPACE</text>

    <!-- URL Address Bar -->
    <rect x="360" y="8" width="420" height="24" rx="4" fill="#141416" stroke="#2E2E33" stroke-width="1"/>
    <text x="570" y="24" fill="#A1A1AA" font-size="11" class="mono" text-anchor="middle">novaslate.web.app/library/class-10/math</text>
    
    <!-- Status Indicator in Top Right -->
    <rect x="1000" y="10" width="120" height="20" rx="10" fill="#193120" stroke="#2D5A34" stroke-width="1"/>
    <circle cx="1012" cy="20" r="3" fill="#4ADE80"/>
    <text x="1022" y="24" fill="#4ADE80" font-size="10" class="mono" font-weight="600">SYNCED · 100%</text>

    <!-- Main Workspace Split -->
    <!-- Left Sidebar: Curriculum Directory (240px) -->
    <g transform="translate(0, 40)">
      <rect width="240" height="587" fill="#161618"/>
      <line x1="240" y1="0" x2="240" y2="587" stroke="#27272A" stroke-width="1"/>
      
      <!-- Sidebar Header -->
      <text x="20" y="32" fill="#71717A" font-size="10" class="mono" font-weight="600" letter-spacing="1">CURRICULUM TREE</text>
      
      <!-- Grade List -->
      <g transform="translate(14, 48)">
        <!-- Class 1-9 Inactive -->
        <rect x="0" y="0" width="212" height="28" rx="4" fill="transparent"/>
        <text x="12" y="18" fill="#71717A" font-size="12" class="sans">Class 1 to 9 Archives</text>
        <text x="195" y="18" fill="#52525B" font-size="10" class="mono" text-anchor="end">9 Grd</text>
        
        <!-- Class 10 Active -->
        <g transform="translate(0, 34)">
          <rect width="212" height="152" rx="6" fill="#222226" stroke="#333338" stroke-width="1"/>
          
          <rect x="0" y="0" width="212" height="30" rx="4" fill="#2A2A30"/>
          <text x="12" y="19" fill="#FAFAFA" font-size="12" class="sans" font-weight="600">Class 10 Secondary</text>
          <rect x="156" y="7" width="46" height="16" rx="8" fill="#162E40"/>
          <text x="179" y="18" fill="#60A5FA" font-size="9" class="mono" text-anchor="middle" font-weight="600">ACTIVE</text>
          
          <!-- Subject Items -->
          <g transform="translate(12, 38)">
            <!-- Mathematics -->
            <rect x="0" y="0" width="188" height="26" rx="4" fill="#18181A" stroke="#2E2E33" stroke-width="1"/>
            <text x="8" y="17" fill="#EDEDED" font-size="11" class="sans" font-weight="500">Mathematics (NCERT)</text>
            <circle cx="176" cy="13" r="2.5" fill="#4ADE80"/>

            <!-- Science -->
            <text x="8" y="47" fill="#A1A1AA" font-size="11" class="sans">Science &amp; Lab Manual</text>
            
            <!-- Social Studies -->
            <text x="8" y="75" fill="#A1A1AA" font-size="11" class="sans">Social Studies (4 Vol.)</text>
            
            <!-- English -->
            <text x="8" y="103" fill="#A1A1AA" font-size="11" class="sans">First Flight &amp; Footprints</text>
          </g>
        </g>
        
        <!-- Class 11-12 -->
        <g transform="translate(0, 196)">
          <text x="12" y="18" fill="#71717A" font-size="12" class="sans">Class 11 Senior Secondary</text>
          <text x="12" y="48" fill="#71717A" font-size="12" class="sans">Class 12 Board Prep</text>
        </g>

        <!-- Storage Telemetry -->
        <g transform="translate(0, 470)">
          <line x1="0" y1="0" x2="212" y2="0" stroke="#27272A" stroke-width="1"/>
          <text x="0" y="24" fill="#71717A" font-size="10" class="mono">LOCAL CACHE: 4.8 GB</text>
          <rect x="0" y="32" width="212" height="4" rx="2" fill="#27272A"/>
          <rect x="0" y="32" width="148" height="4" rx="2" fill="#EDEDED"/>
          <text x="0" y="52" fill="#52525B" font-size="10" class="mono">SD CARD READY · FAT32</text>
        </g>
      </g>
    </g>

    <!-- Center: In-Browser NCERT Reader Workspace (620px) -->
    <g transform="translate(240, 40)">
      <!-- Reader Header Bar -->
      <rect width="620" height="44" fill="#1C1C20"/>
      <line x1="0" y1="44" x2="620" y2="44" stroke="#27272A" stroke-width="1"/>
      
      <text x="24" y="27" fill="#EDEDED" font-size="13" class="sans" font-weight="600">Chapter 1: Real Numbers</text>
      <rect x="210" y="12" width="76" height="20" rx="4" fill="#18181A" stroke="#2E2E33" stroke-width="1"/>
      <text x="248" y="26" fill="#A1A1AA" font-size="10" class="mono" text-anchor="middle">NCERT v24</text>
      
      <!-- Reader Controls -->
      <g transform="translate(420, 10)">
        <rect x="0" y="0" width="60" height="24" rx="4" fill="#18181A" stroke="#2E2E33" stroke-width="1"/>
        <text x="30" y="16" fill="#D4D4D8" font-size="10" class="mono" text-anchor="middle">Pg 4 / 22</text>
        <rect x="68" y="0" width="56" height="24" rx="4" fill="#18181A" stroke="#2E2E33" stroke-width="1"/>
        <text x="96" y="16" fill="#D4D4D8" font-size="10" class="mono" text-anchor="middle">100% ▾</text>
        <rect x="132" y="0" width="56" height="24" rx="4" fill="#EDEDED"/>
        <text x="160" y="16" fill="#111111" font-size="10" class="mono" font-weight="600" text-anchor="middle">SAVE</text>
      </g>

      <!-- Digital Textbook Page Paper Sheet -->
      <g transform="translate(30, 64)">
        <rect width="560" height="495" rx="4" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1"/>
        
        <!-- Document Content -->
        <g transform="translate(40, 44)">
          <!-- Chapter Heading -->
          <text x="0" y="0" fill="#71717A" font-size="10" class="mono" font-weight="600" letter-spacing="1">MATHEMATICS · CLASS X</text>
          <text x="0" y="32" fill="#111111" font-size="22" class="serif" font-weight="700">1.2 Fundamental Theorem of Arithmetic</text>
          <line x1="0" y1="44" x2="480" y2="44" stroke="#E5E5E5" stroke-width="1"/>

          <!-- Body Text -->
          <text x="0" y="68" fill="#27272A" font-size="12" class="sans" line-height="1.5">
            Every composite number can be expressed (factorised) as a product of primes,
          </text>
          <text x="0" y="86" fill="#27272A" font-size="12" class="sans">
            and this factorisation is unique, apart from the order in which the prime factors occur.
          </text>

          <!-- Formula Callout Box -->
          <g transform="translate(0, 108)">
            <rect width="480" height="64" rx="4" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1"/>
            <text x="20" y="26" fill="#71717A" font-size="10" class="mono">CANONICAL PRIME FORMULA</text>
            <text x="20" y="48" fill="#111111" font-size="14" class="mono" font-weight="600">x = p₁^{k₁} · p₂^{k₂} · · · p_n^{k_n}  (p₁ &lt; p₂ &lt; · · · &lt; p_n)</text>
          </g>

          <!-- Theorem Application Example -->
          <g transform="translate(0, 192)">
            <text x="0" y="0" fill="#111111" font-size="13" class="sans" font-weight="600">Example 1 (CBSE Board Question):</text>
            <text x="0" y="20" fill="#52525B" font-size="11.5" class="sans">
              Consider the numbers 4^n, where n is a natural number. Check whether there is any
            </text>
            <text x="0" y="36" fill="#52525B" font-size="11.5" class="sans">
              value of n for which 4^n ends with the digit zero.
            </text>

            <!-- Verification Step -->
            <rect x="0" y="52" width="480" height="42" rx="4" fill="#EDF3EC" stroke="#C4DEC3" stroke-width="1"/>
            <text x="16" y="70" fill="#346538" font-size="10.5" class="mono" font-weight="600">
              SOLUTION: Prime factorisation of 4^n = (2 · 2)^n = 2^{2n}. Does not contain prime factor 5.
            </text>
            <text x="16" y="84" fill="#346538" font-size="10.5" class="mono">
              Hence, 4^n cannot end with digit 0 for any natural number n.
            </text>
          </g>

          <!-- Watermark-Free Guarantee Seal -->
          <g transform="translate(0, 316)">
            <line x1="0" y1="0" x2="480" y2="0" stroke="#E5E5E5" stroke-width="1"/>
            <text x="0" y="22" fill="#71717A" font-size="9.5" class="mono">CURATED &amp; WATERMARK-SANITIZED VIA NOVASLATE AUTOMATION PIPELINE</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Right Sidebar: AI Vision & Inspector (280px) -->
    <g transform="translate(860, 40)">
      <line x1="0" y1="0" x2="0" y2="587" stroke="#27272A" stroke-width="1"/>
      
      <!-- Inspector Header -->
      <rect width="280" height="44" fill="#1C1C20"/>
      <line x1="0" y1="44" x2="280" y2="44" stroke="#27272A" stroke-width="1"/>
      <text x="20" y="27" fill="#EDEDED" font-size="12" class="sans" font-weight="600">Deep Visual Search (AI)</text>
      <rect x="206" y="12" width="56" height="20" rx="4" fill="#193120"/>
      <text x="234" y="25" fill="#4ADE80" font-size="9" class="mono" font-weight="600" text-anchor="middle">FLASH 2.0</text>

      <!-- AI Content Stream -->
      <g transform="translate(16, 60)">
        <!-- Query Box -->
        <rect width="248" height="68" rx="6" fill="#222226" stroke="#333338" stroke-width="1"/>
        <text x="12" y="22" fill="#71717A" font-size="10" class="mono">VISION PROMPT</text>
        <text x="12" y="42" fill="#EDEDED" font-size="11.5" class="sans">Explain prime factor tree for 32760 from current textbook page.</text>
        
        <!-- Response Card -->
        <g transform="translate(0, 80)">
          <rect width="248" height="150" rx="6" fill="#1B1B1E" stroke="#2A2A2E" stroke-width="1"/>
          <text x="12" y="22" fill="#60A5FA" font-size="10" class="mono" font-weight="600">GEMINI FLASH 2.0 EXPLANATION</text>
          
          <text x="12" y="44" fill="#D4D4D8" font-size="11" class="sans" line-height="1.4">
            32760 factor tree resolution:
          </text>
          <text x="12" y="64" fill="#EDEDED" font-size="11" class="mono">
            32760 = 2³ × 3² × 5 × 7 × 13
          </text>
          <text x="12" y="88" fill="#A1A1AA" font-size="10.5" class="sans">
            • 3 powers of 2
          </text>
          <text x="12" y="106" fill="#A1A1AA" font-size="10.5" class="sans">
            • 2 powers of 3
          </text>
          <text x="12" y="124" fill="#A1A1AA" font-size="10.5" class="sans">
            • Unique prime triplet (5, 7, 13)
          </text>
        </g>

        <!-- Readability Metrics -->
        <g transform="translate(0, 244)">
          <text x="0" y="16" fill="#71717A" font-size="10" class="mono">CURATION METRICS</text>
          
          <g transform="translate(0, 26)">
            <rect width="248" height="38" rx="4" fill="#18181A" stroke="#27272A" stroke-width="1"/>
            <text x="12" y="24" fill="#A1A1AA" font-size="11" class="sans">Flesch-Kincaid Grade</text>
            <text x="236" y="24" fill="#EDEDED" font-size="11" class="mono" font-weight="600" text-anchor="end">8.4 (Class 10)</text>
          </g>

          <g transform="translate(0, 70)">
            <rect width="248" height="38" rx="4" fill="#18181A" stroke="#27272A" stroke-width="1"/>
            <text x="12" y="24" fill="#A1A1AA" font-size="11" class="sans">Watermark Removal</text>
            <text x="236" y="24" fill="#4ADE80" font-size="11" class="mono" font-weight="600" text-anchor="end">100% CLEAN</text>
          </g>
        </g>

        <!-- Hardware Push Trigger -->
        <g transform="translate(0, 396)">
          <rect width="248" height="42" rx="6" fill="#EDEDED"/>
          <text x="124" y="25" fill="#111111" font-size="11.5" class="sans" font-weight="600" text-anchor="middle">Push to Atlas Device →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
